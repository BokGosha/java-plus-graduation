server:
  port: ${SERVER_PORT:8089}

grpc:
  server:
    port: 0

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1

  consumer-user-actions:
    group-id: ${KAFKA_CONSUMER_USER_ACTIONS_GROUP_ID:analyzer}
    key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
    value-deserializer: ru.practicum.ewm.stats.kafka.deserializer.UserActionAvroDeserializer
    poll-timeout-ms: 1000

  consumer-events-similarity:
    group-id: ${KAFKA_CONSUMER_EVENTS_SIMILARITY_GROUP_ID:analyzer}
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.practicum.ewm.stats.kafka.deserializer.EventSimilarityAvroDeserializer
    poll-timeout-ms: 1000

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/analyzer}

analyzer:
  recommendations:
    neighbours-count: ${ANALYZER_NEIGHBOURS_COUNT:5}
