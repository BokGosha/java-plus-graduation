server:
  port: ${SERVER_PORT:8088}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:aggregator}
    key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
    value-deserializer: ru.practicum.ewm.stats.kafka.deserializer.UserActionAvroDeserializer
    poll-timeout-ms: 1000

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: ru.practicum.ewm.stats.kafka.serializer.GeneralAvroSerializer

  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1
