x-core-service: &core-service
  restart: unless-stopped
  environment: &core-env
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 40s

x-postgres: &postgres
  image: postgres:17
  restart: unless-stopped

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10

services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  stats-server:
    build:
      context: .
      dockerfile: stats-service/stats-server/Dockerfile
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  user-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1" ]

  event-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      event-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1" ]

  request-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1" ]

  compilation-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/compilation-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      compilation-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://compilation-db:5432/compilations
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1" ]

  comment-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      comment-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comments
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1" ]

  stats-db:
    <<: *postgres
    ports:
      - "5433:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: stats
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stats" ]

  user-db:
    <<: *postgres
    ports:
      - "5435:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]

  event-db:
    <<: *postgres
    ports:
      - "5436:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: events
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d events" ]

  request-db:
    <<: *postgres
    ports:
      - "5437:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: requests
    volumes:
      - request-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d requests" ]

  compilation-db:
    <<: *postgres
    ports:
      - "5438:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: compilations
    volumes:
      - compilation-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d compilations" ]

  comment-db:
    <<: *postgres
    ports:
      - "5439:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: comments
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d comments" ]

volumes:
  stats-db-data:
  user-db-data:
  event-db-data:
  request-db-data:
  compilation-db-data:
  comment-db-data:
