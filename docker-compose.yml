x-core-service: &core-service
  restart: unless-stopped
  environment: &core-env
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 40s

x-stats-service: &stats-service
  restart: unless-stopped
  environment: &stats-env
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-postgres: &postgres
  image: postgres:17
  restart: unless-stopped

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10

services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                            --partitions 1 --replication-factor 1 --if-not-exists \
                            --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                            --partitions 1 --replication-factor 1 --if-not-exists \
                            --bootstrap-server kafka:29092'"
    init: true

  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    container_name: gateway-server
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]

  collector:
    <<: *stats-service
    build:
      context: .
      dockerfile: stats-service/collector/Dockerfile
    container_name: collector
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1" ]



  aggregator:
    <<: *stats-service
    build:
      context: .
      dockerfile: stats-service/aggregator/Dockerfile
    container_name: aggregator
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health || exit 1" ]

  analyzer:
    <<: *stats-service
    build:
      context: .
      dockerfile: stats-service/analyzer/Dockerfile
    container_name: analyzer
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      analyzer-db:
        condition: service_healthy
    environment:
      <<: *stats-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://analyzer-db:5432/analyzer
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health || exit 1" ]

  user-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    container_name: user-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1" ]

  event-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    container_name: event-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      event-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1" ]

  request-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    container_name: request-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1" ]

  compilation-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/compilation-service/Dockerfile
    container_name: compilation-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      compilation-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://compilation-db:5432/compilations
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1" ]

  comment-service:
    <<: *core-service
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    container_name: comment-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      comment-db:
        condition: service_healthy
    environment:
      <<: *core-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comments
    healthcheck:
      <<: *service-healthcheck
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1" ]

  analyzer-db:
    <<: *postgres
    container_name: analyzer-db
    ports:
      - "5434:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: analyzer
    volumes:
      - analyzer-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d analyzer" ]

  user-db:
    <<: *postgres
    container_name: user-db
    ports:
      - "5435:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]

  event-db:
    <<: *postgres
    container_name: event-db
    ports:
      - "5436:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: events
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d events" ]

  request-db:
    <<: *postgres
    container_name: request-db
    ports:
      - "5437:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: requests
    volumes:
      - request-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d requests" ]

  compilation-db:
    <<: *postgres
    container_name: compilation-db
    ports:
      - "5438:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: compilations
    volumes:
      - compilation-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d compilations" ]

  comment-db:
    <<: *postgres
    container_name: comment-db
    ports:
      - "5439:5432"
    environment:
      <<: *postgres-env
      POSTGRES_DB: comments
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: [ "CMD-SHELL", "pg_isready -U postgres -d comments" ]

volumes:
  kafka-data:
  analyzer-db-data:
  user-db-data:
  event-db-data:
  request-db-data:
  compilation-db-data:
  comment-db-data:
