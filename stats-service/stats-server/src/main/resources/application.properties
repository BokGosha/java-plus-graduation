spring.application.name=stats-server

server.port=0

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/stats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddlAuto=none
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

eureka.instance.instanceId=${spring.application.name}:${random.uuid}